pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "UykuTakip"
include ":app"
include ":core"
include ":data"
include ":feature:sleep"
include ":feature:nutrition"
include ":feature:hydration"
include ":feature:agenda"
include ":feature:private-tracking"
include ":feature:stats"
include ":feature:settings"
include ":feature:ideas"
include ":feature:shopping"
include ":macrobenchmark"
include ":sync-protocol"
